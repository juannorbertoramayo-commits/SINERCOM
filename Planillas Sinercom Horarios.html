const DIAS  = ['Do','Lu','Ma','Mi','Ju','Vi','Sá'];

let toastTimer = null;
function showToast(msg, err, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : (ok ? ' ok' : ''));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2200);
}

function promptPassword(expected) {
  const pwd = prompt('Ingresá la clave de administrador:');
  if (pwd === null) return false;
  if (pwd !== expected) { showToast('Clave incorrecta', true); return false; }
  return true;
}

/* ---------- Pestañas ---------- */
(function () {
  const btns = document.querySelectorAll('.tabs button');
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });
})();

/* ---------- Encabezado con meses / días / día-semana ---------- */
function buildDateHeader(table, dates, infoLabel) {
  const thead = document.createElement('thead');

  const trMes = document.createElement('tr');
  const thInfo = document.createElement('th');
  thInfo.className = 'col-info';
  thInfo.rowSpan = 3;
  thInfo.textContent = infoLabel;
  trMes.appendChild(thInfo);

  let mesActual = -1, span = 0;
  for (let i = 0; i < dates.length; i++) {
    const m = dates[i].getMonth();
    if (m !== mesActual) {
      if (mesActual !== -1) {
        const th = document.createElement('th');
        th.colSpan = span;
        th.textContent = MESES[mesActual] + ' 2026';
        trMes.appendChild(th);
      }
      mesActual = m; span = 1;
    } else span++;
  }
  if (mesActual !== -1) {
    const th = document.createElement('th');
    th.colSpan = span;
    th.textContent = MESES[mesActual] + ' 2026';
    trMes.appendChild(th);
  }
  thead.appendChild(trMes);

  const trDia = document.createElement('tr');
  dates.forEach(f => {
    const th = document.createElement('th');
    th.textContent = f.getDate();
    trDia.appendChild(th);
  });
  thead.appendChild(trDia);

  const trDow = document.createElement('tr');
  dates.forEach(f => {
    const th = document.createElement('th');
    th.textContent = DIAS[f.getDay()];
    trDow.appendChild(th);
  });
  thead.appendChild(trDow);

  table.appendChild(thead);
}

/* ============================================================
   DESCARGA PDF
   ============================================================ */
function downloadPDF(element, filename) {
  if (typeof html2pdf === 'undefined') {
    showToast('Librería PDF no disponible. Verificá tu conexión.', true);
    return;
  }

  showToast('Generando PDF, aguardá unos segundos…');

  const clone = element.cloneNode(true);
  clone.style.maxHeight = 'none';
  clone.style.overflow  = 'visible';
  clone.style.height    = 'auto';
  clone.style.borderRadius = '0';
  clone.style.border = '1px solid #999';
  clone.style.background = '#fff';

  clone.querySelectorAll('th, td, .col-info, .row-header, .row-header-puesto').forEach(n => {
    n.style.position = 'static';
    n.style.left = 'auto';
    n.style.top = 'auto';
    n.style.zIndex = 'auto';
  });

  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.left = '-99999px';
  wrapper.style.top  = '0';
  wrapper.style.background = '#fff';
  wrapper.style.padding = '6px';
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);

  const widthPx  = wrapper.scrollWidth;
  const heightPx = wrapper.scrollHeight;
  const widthMm  = Math.max(widthPx / 3.7795, 100);
  const heightMm = Math.max(heightPx / 3.7795, 50);

  const opt = {
    margin: 3,
    filename: filename,
    image: { type: 'jpeg', quality: 0.95 },
    html2canvas: {
      scale: 1.5,
      useCORS: true,
      logging: false,
      backgroundColor: '#ffffff'
    },
    jsPDF: {
      unit: 'mm',
      format: [widthMm, heightMm],
      orientation: 'landscape'
    }
  };

  html2pdf().set(opt).from(wrapper).save()
    .then(() => {
      showToast('✅ PDF descargado', false, true);
      if (wrapper.parentNode) document.body.removeChild(wrapper);
    })
    .catch(err => {
      console.error('PDF error:', err);
      showToast('Error al generar PDF', true);
      if (wrapper.parentNode) document.body.removeChild(wrapper);
    });
}

  function extraerColaboradores() {
    const set = new Set();
    turnos.forEach(t => t.valores.forEach(v => {
      if (v) v.split(/[\/,]/).map(s => s.trim()).filter(Boolean).forEach(p => set.add(p));
    }));
    set.delete('AG');
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }

  function generarColorMap(nombres) {
    const m = {};
    nombres.forEach((n, i) => m[n] = PALETA[i % PALETA.length]);
    return m;
  }

  function colorDe(valor) {
    if (!valor) return '';
    for (const c of colaboradores) if (valor.includes(c)) return colorMap[c] || '';
    return '';
  }

  function render() {
    colaboradores = extraerColaboradores();
    colorMap = generarColorMap(colaboradores);

    let html = '<table><thead><tr>';
    html += '<th class="col-info">Horario</th>';
    html += '<th class="col-info col-info-2">Puesto</th>';
    fechas.forEach(f => { html += '<th>' + f + '</th>'; });
    html += '</tr></thead><tbody>';

    turnos.forEach((turno, ti) => {
      html += '<tr>';
      html += '<td class="row-header">' + turno.horario + '</td>';
      html += '<td class="row-header-puesto">' + turno.puesto + '</td>';
      for (let i = 0; i < fechas.length; i++) {
        const valor = turno.valores[i] || '';
        const bg = colorDe(valor);
        const style = bg ? ' style="background:' + bg + ';color:#000;font-weight:600;"' : '';
        if (editMode) {
          const opts = [''].concat(colaboradores);
          if (valor && !opts.includes(valor)) opts.push(valor);
          html += '<td data-t="' + ti + '" data-d="' + i + '"' + style + '>';
          html += '<select class="cell-select" data-t="' + ti + '" data-d="' + i + '">';
          opts.forEach(o => {
            const lbl = o === '' ? '—' : o;
            const sel = (o === valor) ? ' selected' : '';
            html += '<option value="' + o.replace(/"/g, '&quot;') + '"' + sel + '>' + lbl + '</option>';
          });
          html += '</select></td>';
        } else {
          html += '<td data-t="' + ti + '" data-d="' + i + '"' + style + '>' + valor + '</td>';
        }
      }
      html += '</tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;

    if (editMode) {
      wrap.querySelectorAll('select').forEach(sel => {
        sel.addEventListener('change', function () {
          const t = +this.dataset.t, d = +this.dataset.d;
          turnos[t].valores[d] = this.value;
          const td = this.closest('td');
          const bg = colorDe(this.value);
          td.style.background = bg || '';
          td.style.color = bg ? '#000' : '';
          td.style.fontWeight = bg ? '600' : '';
        });
      });
    }
    renderLeyenda();
  }

  function renderLeyenda() {
    leyendaEl.innerHTML = '';
    colaboradores.forEach(c => {
      const d = document.createElement('div');
      d.style.background = colorMap[c];
      d.style.color = '#1a237e';
      d.innerHTML = '<span class="swatch" style="background:' + colorMap[c] + '"></span>' + c;
      leyendaEl.appendChild(d);
    });
  }

  render();

  return {
    isEdit: () => editMode,
    setEdit: v => { editMode = v; render(); }
  };
})();

  function gIdx(d) {
    const a = Date.UTC(ORIGIN.getFullYear(), ORIGIN.getMonth(), ORIGIN.getDate());
    const b = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
    return Math.round((b - a) / 86400000);
  }

    switch (code) {
      case 'LR':
        if (idx <= 33) return (idx % 5 === 3) ? 'LH' : 'LR';
        return ((idx - 38) % 5 === 0) ? 'LR' : 'AV';
      case 'LB':
        if (idx <= 32) return (idx % 5 === 4) ? '' : 'LB';
        return ((idx - 35) % 5 === 0) ? '' : 'DB';
      case 'LH':
        if (idx <= 31) { const p = idx % 5; return (p === 2 || p === 3) ? '' : 'LH'; }

      case 'NE':
        if (idx <= 32) return (idx >= 5 && idx % 5 === 0) ? '' : 'NE';
        return ((idx - 36) % 5 === 0) ? '' : 'SR';

        return ((idx - 38) % 5 === 0) ? '' : 'NE';
      case 'OK':
        return (idx >= 5 && idx % 5 === 0) ? '' : 'OK';

      default: return '';
    }

/* ============================================================
   MÓDULO PLANILLA GUADALUPE
   ============================================================ */
const GP = (function () {
  const START = new Date(2026, 8, 1);
  const END   = new Date(2026, 11, 1);

  const CODES = {
    MF: { nombre: 'MARIO FERNANDEZ',     bg: '#c5cae9', fg: '#1a237e' },
    ER: { nombre: 'ELVIS RANGEL',        bg: '#c8e6c9', fg: '#1b5e20' },
    NV: { nombre: 'Nicolas Venetz',      bg: '#ffe0b2', fg: '#e65100' },
    NM: { nombre: 'NAZARENO MARTINEZ',   bg: '#e1bee7', fg: '#4a148c' },
    LS: { nombre: 'LUCAS SOLVER',        bg: '#b2dfdb', fg: '#004d40' },
    NG: { nombre: 'NICOLAS GAMARRA',     bg: '#f8bbd0', fg: '#880e4f' },
    LM: { nombre: 'LAUTARO MONZON',      bg: '#fff9c4', fg: '#827717' },
    MG: { nombre: 'MAXIMILIANO GALEANO', bg: '#d7ccc8', fg: '#3e2723' }
  };

  function rep(c, n) { return Array(n).fill(c); }

  const R1 = [].concat(
    ['MF'],
    rep('ER', 6), rep('NV', 6), rep('NM', 6), rep('LS', 6),
    rep('ER', 6), rep('NV', 6), rep('NM', 6), rep('LS', 6),
    rep('ER', 6), rep('NV', 6), rep('NM', 6),
    rep('MF', 6), rep('ER', 6), rep('NG', 6), rep('NM', 6),
    ['']
  );

  const R2 = [].concat(
    rep('NG', 3), rep('LS', 6), rep('ER', 6), rep('NV', 6),
    rep('NM', 6), rep('LS', 6), rep('ER', 6), rep('NV', 6),
    rep('NM', 6), rep('LS', 6), rep('ER', 6), rep('NV', 6),
    rep('NM', 6), rep('LS', 4), rep('NV', 6), rep('LS', 4),
    rep('LM', 3)
  );

  const R3 = [].concat(
    ['LS'],
    rep('LM', 6), rep('NG', 4), rep('MF', 6), rep('LM', 6),
    rep('NG', 4), rep('MF', 6), rep('LM', 6), rep('MF', 2),
    rep('LM', 6), rep('NG', 4), rep('MF', 6), rep('LM', 6),
    rep('MF', 2), rep('ER', 6), rep('NG', 4), rep('MF', 6),
    rep('ER', 6), rep('NG', 5)
  );

  const R4 = [].concat(
    rep('NV', 5), rep('NM', 6), rep('LS', 6), rep('ER', 6),
    rep('NV', 6), rep('NM', 6), rep('LS', 6), rep('ER', 6),
    rep('NV', 6), rep('NM', 6), rep('LS', 6), rep('LM', 6),
    rep('NV', 6), rep('NM', 6), rep('LM', 4), rep('NV', 5)
  );

  const R5 = [].concat(
    rep('NM', 3), rep('MF', 6), rep('LM', 6), rep('NG', 4),
    rep('MF', 6), rep('LM', 6), rep('NG', 4), rep('MF', 4),
    rep('NG', 4), rep('MF', 6), rep('LM', 6), rep('NG', 4),
    rep('MF', 4), rep('NG', 4), rep('LS', 6), rep('LM', 6),
    rep('LS', 2), rep('LM', 2), rep('MF', 6), rep('ER', 3)
  );

  const R6 = [].concat(
    rep('', 5),  ['NG', 'NG'],
    rep('', 6),  ['NG', 'NG'],
    rep('', 6),  ['NG', 'NG'],
    rep('', 6),  ['NG', 'NG'],
    rep('', 6),  ['NG', 'NG'],
    rep('', 6),  ['NG', 'NG'],
    rep('', 6),  ['NG', 'NG'],
    rep('', 6),  ['NG', 'NG'],
    rep('', 8),  ['NG', 'NG'],
    rep('', 6),  ['LS', 'LS'],
    rep('', 4),  ['LM'],
    rep('', 2),  ['LS'],
    rep('', 3)
  );

  const R7 = [].concat(
    rep('MG', 5), [''], rep('MG', 6), [''], rep('MG', 6), [''],
    rep('MG', 6), [''], rep('MG', 6), [''], rep('MG', 6), [''],
    rep('MG', 6), [''], rep('MG', 6), [''], rep('MG', 6), [''],
    rep('MG', 6), [''], rep('MG', 6), [''], rep('MG', 6), [''],
    rep('MG', 6), [''], rep('MG', 6), [''], rep('MG', 6)
  );

  const ROWS = [
    { label: '23:00 - 06:00',          data: R1 },
    { label: '06:00 - 14:00',          data: R2 },
    { label: '07:00 - 15:00',          data: R3 },
    { label: '14:00 - 21:50',          data: R4 },
    { label: '15:15 - 23:00',          data: R5 },
    { label: '8 a 12 hs - 16 a 20 hs', data: R6 },
    { label: '🛻 Lun - Sab medio día', data: R7 }
  ];

  const cName = c => CODES[c] ? CODES[c].nombre : c;
  const cBg   = c => CODES[c] ? CODES[c].bg : '#ffffff';
  const cFg   = c => CODES[c] ? CODES[c].fg : '#1a237e';

  const dates = [];
  { const d = new Date(START); while (d <= END) { dates.push(new Date(d)); d.setDate(d.getDate() + 1); } }

  const wrap = document.getElementById('gpTableWrap');
  const leyendaEl = document.getElementById('leyendaGP');
  const allCells = [];
  let editMode = false;

  function paintCell(td, val) {
    td.innerHTML = '';
    if (val && CODES[val]) {
      td.textContent = cName(val);
      td.style.background = cBg(val);
      td.style.color      = cFg(val);
      td.classList.remove('empty');
    } else if (val) {
      td.textContent = val;
      td.style.background = '#fff';
      td.style.color      = '#1a237e';
      td.classList.remove('empty');
    } else {
      td.textContent = '—';
      td.style.background = '#fafafa';
      td.style.color      = '#bbb';
      td.classList.add('empty');
    }
  }

  function build() {
    const table = document.createElement('table');
    buildDateHeader(table, dates, 'Horario / Día');

    const tbody = document.createElement('tbody');
    allCells.length = 0;

    for (const row of ROWS) {
      const tr = document.createElement('tr');

      const tdInfo = document.createElement('td');
      tdInfo.className = 'col-info';
      tdInfo.innerHTML = '<b>' + row.label + '</b>';
      tr.appendChild(tdInfo);

      for (let i = 0; i < dates.length; i++) {
        const td = document.createElement('td');
        const val = row.data[i] || '';
        td.dataset.val = val;
        td.classList.add('cell');
        paintCell(td, val);
        tr.appendChild(td);
        allCells.push(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    wrap.innerHTML = '';
    wrap.appendChild(table);
  }

  function entrar() {
    editMode = true;
    for (const td of allCells) {
      const actual = td.dataset.val || '';
      td.innerHTML = '';
      td.style.background = '#ffffff';

      const sel = document.createElement('select');
      sel.className = 'cell-select';
      const opts = [''].concat(Object.keys(CODES));
      for (const o of opts) {
        const opt = document.createElement('option');
        opt.value = o;
        opt.textContent = o ? cName(o) : '—';
        if (o === actual) opt.selected = true;
        sel.appendChild(opt);
      }
      if (actual && CODES[actual]) {
        sel.style.background = cBg(actual);
        sel.style.color      = cFg(actual);
      }
      sel.addEventListener('change', function () {
        td.dataset.val = sel.value;
        if (sel.value && CODES[sel.value]) {
          sel.style.background = cBg(sel.value);
          sel.style.color      = cFg(sel.value);
        } else {
          sel.style.background = '#fff';
          sel.style.color      = '#1a237e';
        }
      });
      td.appendChild(sel);
    }
  }

  function salir() {
    editMode = false;
    for (const td of allCells) {
      const sel = td.querySelector('select');
      if (sel) td.dataset.val = sel.value;
      paintCell(td, td.dataset.val || '');
    }
  }

  build();

  for (const [c, info] of Object.entries(CODES)) {
    const d = document.createElement('div');
    d.style.background = info.bg;
    d.style.color      = info.fg;
    d.innerHTML = '<span class="swatch" style="background:' + info.bg + '"></span>' +
                  '<b style="min-width:34px;display:inline-block">' + c + '</b> ' + info.nombre;
    leyendaEl.appendChild(d);
  }

  return { isEdit: () => editMode, entrar, salir };
})();

/* ============================================================

const btnSA  = document.getElementById('btnEditSA');
const btnSA2 = document.getElementById('btnEditSA2');
const hintSA = document.getElementById('hintSA');
let saEdit = false;

function updateSAButtons() {
  btnSA.textContent  = saEdit ? '💾 Guardar y salir' : '🔐 Editar planillas';
  btnSA.classList.toggle('active', saEdit);

  btnSA2.textContent = saEdit ? '💾 Guardar y salir' : '🔏Editar';
  btnSA2.classList.toggle('active', saEdit);

  hintSA.textContent = saEdit
    ? 'Modo edición activo · elegí un colaborador por día'
    : 'Vista de solo lectura';
}

function enterSAEdit() {
  SA.entrar();
  SpotSA.setEdit(true);
  saEdit = true;
  updateSAButtons();
  showToast('Modo edición activado');
}

function exitSAEdit(silent) {
  if (!saEdit) return;
  SA.salir();
  SpotSA.setEdit(false);
  saEdit = false;
  updateSAButtons();
  if (!silent) showToast('Cambios guardados', false, true);
}

btnSA.addEventListener('click', function () {
  if (saEdit) { exitSAEdit(); return; }
  if (!promptPassword(PWD_ADMIN)) return;
  enterSAEdit();
});

btnSA2.addEventListener('click', function () {
  if (saEdit) { exitSAEdit(); return; }
  if (!promptPassword(PWD_ZAZU)) return;
  enterSAEdit();
});

document.getElementById('btnPdfSA').addEventListener('click', function () {
  if (saEdit) exitSAEdit(true);
  setTimeout(() => {
    downloadPDF(document.getElementById('saTableWrap'), 'Planilla_SA.pdf');
  }, 200);
});

});
